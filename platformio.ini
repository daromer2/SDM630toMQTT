; SDM630toMQTT - Eastron SDM energy meter (Modbus RTU) -> MQTT / Home Assistant gateway
;
; Build:   pio run -e d1_mini        (ESP8266 Wemos D1 mini and clones)
;          pio run -e esp32s3        (ESP32-S3 DevKit / SuperMini style boards)
; Flash:   pio run -e d1_mini -t upload
; Later updates can be done from the web UI (System -> Firmware update).

[platformio]
default_envs = d1_mini, esp32s3

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.1
build_flags =
    -DFW_VERSION=\"2.0.0\"

[env:d1_mini]
platform = espressif8266 @ ^4.2.1
board = d1_mini
board_build.filesystem = littlefs
; 4MB flash: ~1MB sketch (room for web OTA), 1MB LittleFS
board_build.ldscript = eagle.flash.4m1m.ld
; Logs go to Serial1 (TX only, GPIO2 / D4) because UART0 is used for Modbus by default.
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

[env:esp32s3]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
; Native USB CDC for logs (works on SuperMini boards that only have the USB-C of the S3 itself)
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
